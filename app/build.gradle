plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.tvtest.hdmi'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.tvtest.hdmi'
        minSdk 21
        // Телевізор на Android 7 (API 24/25): старий targetSdk не вимагає
        // запитів дозволів під час роботи.
        targetSdk 25
        versionCode 2
        versionName '0.2'
    }

    // Постійний ключ підпису, щоб нові збірки ставилися поверх старих.
    // Це особистий застосунок для одного телевізора, тому ключ лежить у репозиторії.
    signingConfigs {
        tv {
            storeFile rootProject.file('signing/tv.keystore')
            storePassword 'tvlauncher'
            keyAlias 'tv'
            keyPassword 'tvlauncher'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tv
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
