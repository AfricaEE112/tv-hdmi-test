plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.domivka'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.domivka'
        // Телевізор: Android 7.0 (API 24)
        minSdk 24
        targetSdk 25
        versionCode 8
        versionName '2.2'
    }

    signingConfigs {
        tv {
            storeFile rootProject.file('signing/tv.keystore')
            storePassword 'tvlauncher'
            keyAlias 'tv'
            keyPassword 'tvlauncher'
            // Установник цього телевізора (Android 7.0) не приймає APK лише з підписом v2.
            // При minSdk 24 Gradle вимикає v1 за замовчуванням, тому вмикаємо обидва явно.
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tv
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
