name: APK tools
# Допоміжні файли для перенесення застосунків на Android 7:
# база рівнів API (api-versions.xml з Android SDK) і шими, зібрані d8 під minSdk 24.
on:
  push:
    paths: ['.github/workflows/apk-tools.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: API database and android.jar
        run: |
          mkdir -p out
          echo "SDK: $ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          API=$(find "$ANDROID_HOME/platforms" -name api-versions.xml | sort -V | tail -1)
          echo "using $API"
          gzip -9c "$API" > out/api-versions.xml.gz
          # android.jar і d8 для локальної збірки шимів
          JAR=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$JAR" out/android.jar
          cp "$BT/lib/d8.jar" out/d8.jar
          echo "$JAR $BT" > out/versions.txt
      - name: Build shims (if any)
        run: |
          if [ -d apkfix/shim ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            JAR=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
            mkdir -p cls
            javac --release 8 -encoding UTF-8 -cp "$JAR" -d cls $(find apkfix/shim -name '*.java')
            "$BT/d8" --release --min-api 24 --lib "$JAR" --output out $(find cls -name '*.class')
            mv out/classes.dex out/shim.dex
          fi
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-tools --yes --cleanup-tag || true
          gh release create apk-tools out/* --prerelease --target "${{ github.sha }}" \
            --title "APK tools" --notes "api-versions.xml і шими для Android 7"
