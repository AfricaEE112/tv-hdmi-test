name: Probe TLS chains
# Які кореневі сертифікати потрібні сайтам (для перенесення застосунків на Android 7)
on:
  push:
    paths: ['.github/workflows/probe-tls.yml']
jobs:
  tls:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in animeon.club api.mikai.me api.themoviedb.org ashdi.vip eneyida.tv hdvbua.pro image.tmdb.org klonua.com moonanime.art moonanime.net uafix.net uakino.best uakino.eu uakino.ofreshofresh.workers.dev uaserials.my zetvideo.net; do
            echo "=== $h"
            echo | timeout 15 openssl s_client -connect $h:443 -servername $h -showcerts 2>/dev/null | grep -E "^ *[0-9]+ s:|^ *i:" | head -8
            echo | timeout 15 openssl s_client -connect $h:443 -servername $h 2>&1 | grep -E "Verify return code" | head -1
          done
