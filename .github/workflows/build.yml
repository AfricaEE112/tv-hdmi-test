name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk hdmi-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-test
          path: hdmi-test.apk

      # Постійне посилання для завантаження:
      # https://github.com/<власник>/<репозиторій>/releases/download/latest/hdmi-test.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest hdmi-test.apk \
            --target "${{ github.sha }}" \
            --title "Остання збірка" \
            --notes "Автоматична збірка з коміту ${{ github.sha }}"
