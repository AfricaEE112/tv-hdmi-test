name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs, pack tools
        run: |
          cp launcher/build/outputs/apk/debug/launcher-debug.apk domivka.apk
          cp app/build/outputs/apk/debug/app-debug.apk hdmi-test.apk
          (cd tools && zip -r ../tv-tools.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            domivka.apk
            hdmi-test.apk

      # Постійні посилання для завантаження:
      # https://github.com/<власник>/<репозиторій>/releases/download/latest/domivka.apk
      # https://github.com/<власник>/<репозиторій>/releases/download/latest/hdmi-test.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest domivka.apk hdmi-test.apk tv-tools.zip \
            --target "${{ github.sha }}" \
            --title "Остання збірка" \
            --notes "Автоматична збірка з коміту ${{ github.sha }}"
