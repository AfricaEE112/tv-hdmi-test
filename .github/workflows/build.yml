name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs, pack tools
        run: |
          cp launcher/build/outputs/apk/debug/launcher-debug.apk domivka.apk
          cp app/build/outputs/apk/debug/app-debug.apk hdmi-test.apk
          (cd tools && zip -r ../tv-tools.zip .)
          # Для оновлення по повітрю: Домівка порівнює versionCode зі своїм і показує notes
          python3 - <<'PY'
          import json, re
          g = open('launcher/build.gradle', encoding='utf-8').read()
          vc = int(re.search(r"versionCode (\d+)", g).group(1))
          vn = re.search(r"versionName '([^']+)'", g).group(1)
          notes = open('launcher/src/main/res/raw/whatsnew.txt', encoding='utf-8').read().strip()
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump({"versionCode": vc, "versionName": vn, "notes": notes}, f, ensure_ascii=False)
          PY
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            domivka.apk
            hdmi-test.apk

      # Постійні посилання для завантаження:
      # https://github.com/<власник>/<репозиторій>/releases/download/latest/domivka.apk
      # https://github.com/<власник>/<репозиторій>/releases/download/latest/hdmi-test.apk
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest domivka.apk hdmi-test.apk tv-tools.zip version.json \
            --target "${{ github.sha }}" \
            --title "Остання збірка" \
            --notes "Автоматична збірка з коміту ${{ github.sha }}"
