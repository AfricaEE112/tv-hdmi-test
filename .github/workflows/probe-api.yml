name: Probe APIs
on:
  push:
    paths: ['.github/workflows/probe-api.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Alerts (ubilling)
        run: |
          curl -sS -m 20 -A "Domivka" https://ubilling.net.ua/aerialalerts/ | head -c 6000; echo
          echo "--- cert chain"
          echo | openssl s_client -connect ubilling.net.ua:443 -servername ubilling.net.ua -showcerts 2>/dev/null | grep -E "s:|i:" | head -8
      - name: Geocoding Voronkiv
        run: |
          curl -sS -m 20 "https://geocoding-api.open-meteo.com/v1/search?name=%D0%92%D0%BE%D1%80%D0%BE%D0%BD%D1%8C%D0%BA%D1%96%D0%B2&count=10&language=uk&format=json"; echo
          curl -sS -m 20 "https://geocoding-api.open-meteo.com/v1/search?name=Voronkiv&count=10&language=en&format=json"; echo
          curl -sS -m 20 -A "Domivka-probe/1.0 (github.com/AfricaEE112/tv-hdmi-test)" "https://nominatim.openstreetmap.org/search?q=%D0%92%D0%BE%D1%80%D0%BE%D0%BD%D1%8C%D0%BA%D1%96%D0%B2%2C+%D0%91%D0%BE%D1%80%D0%B8%D1%81%D0%BF%D1%96%D0%BB%D1%8C%D1%81%D1%8C%D0%BA%D0%B8%D0%B9+%D1%80%D0%B0%D0%B9%D0%BE%D0%BD&format=json&limit=5"; echo
      - name: Open-Meteo hourly
        run: |
          curl -sS -m 20 "https://api.open-meteo.com/v1/forecast?latitude=50.35&longitude=30.95&hourly=temperature_2m,weather_code,is_day&forecast_hours=12&timezone=Europe%2FKyiv" | head -c 3000; echo
